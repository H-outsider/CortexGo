name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: go build -trimpath -o cortexgo ./cmd/cortexgo
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
